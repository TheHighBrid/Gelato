name: Sep 27 canonical migration

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/sep27-pdp-audio-audit]
    paths:
      - '.github/workflows/sep27-canonical-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sep27-pdp-audio-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate audit fixes into canonical owners
        shell: python
        run: |
          from pathlib import Path
          import re
          pdp_path=Path('sections/melato-product-page-rebuild.liquid'); pdp=pdp_path.read_text()
          pdp=pdp.replace('current_variant.price | money }}','current_variant.price | money_with_currency }}').replace('current_variant.compare_at_price | money }}','current_variant.compare_at_price | money_with_currency }}').replace('product.price | money }}</p>','product.price | money_with_currency }}</p>').replace('matching_product.price | money }}</p>','matching_product.price | money_with_currency }}</p>').replace("Shopify.formatMoney(cents,{{ shop.money_format | json }})","Shopify.formatMoney(cents,{{ shop.money_with_currency_format | json }})")
          old='''              <p class="purchase-summary__price">{{ matching_product.price | money_with_currency }}</p>\n              <a class="pdp-set-cta" href="{{ matching_product.url }}">View matching piece</a>\n            </article>\n          </div>\n        </section>'''
          new='''              <p class="purchase-summary__price">{{ matching_product.price | money_with_currency }}</p>\n              <a class="pdp-set-cta" href="{{ matching_product.url }}">View matching piece</a>\n            </article>\n          </div>\n          <div class="melato-full-set-action melato-full-set-action--canonical" data-melato-server-full-set data-currency="{{ shop.currency | escape }}">\n            <div class="melato-full-set-selectors">\n              <label class="melato-full-set-selector"><span>{% if product_title_down contains 'pant' %}Pant{% else %}Jacket{% endif %} size</span><select data-melato-set-current>{% for variant in product.variants %}{% if variant.available %}<option value="{{ variant.id }}" data-price="{{ variant.price }}"{% if variant.id == current_variant.id %} selected{% endif %}>{{ variant.title }}</option>{% endif %}{% endfor %}</select></label>\n              <label class="melato-full-set-selector"><span>{% if product_title_down contains 'pant' %}Jacket{% else %}Pant{% endif %} size</span><select data-melato-set-matching>{% for variant in matching_product.variants %}{% if variant.available %}<option value="{{ variant.id }}" data-price="{{ variant.price }}"{% if variant.id == matching_product.selected_or_first_available_variant.id %} selected{% endif %}>{{ variant.title }}</option>{% endif %}{% endfor %}</select></label>\n            </div>\n            <p class="melato-full-set-price"><span>Full set</span><strong data-melato-set-total>{{ current_variant.price | plus: matching_product.selected_or_first_available_variant.price | money_with_currency }}</strong></p>\n            <button type="button" class="melato-full-set-button" data-melato-set-add>ADD FULL SET</button><p class="melato-full-set-status" data-melato-set-status role="status" aria-live="polite"></p>\n          </div>\n        </section>'''
          if old not in pdp: raise SystemExit('Complete the Set anchor not found')
          pdp=pdp.replace(old,new,1)
          anchor="  var stickyButton=section.querySelector('[data-pdp-sticky-button]');"
          runtime=r'''  var fullSet=section.querySelector('[data-melato-server-full-set]');
          if(fullSet){var a=fullSet.querySelector('[data-melato-set-current]'),b=fullSet.querySelector('[data-melato-set-matching]'),total=fullSet.querySelector('[data-melato-set-total]'),add=fullSet.querySelector('[data-melato-set-add]'),status=fullSet.querySelector('[data-melato-set-status]');function syncSet(){if(!a||!b||!total)return;total.textContent=formatMoney(Number(a.options[a.selectedIndex].dataset.price||0)+Number(b.options[b.selectedIndex].dataset.price||0))}if(a)a.addEventListener('change',syncSet);if(b)b.addEventListener('change',syncSet);syncSet();if(add)add.addEventListener('click',function(){add.disabled=true;if(status)status.textContent='Adding set…';fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({items:[{id:Number(a.value),quantity:1},{id:Number(b.value),quantity:1}]})}).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(){if(status)status.textContent='Full set added to cart';document.dispatchEvent(new CustomEvent('cart:refresh'))}).catch(function(){if(status)status.textContent='Could not add the full set. Please try again.'}).finally(function(){add.disabled=false})})}

'''
          if anchor not in pdp: raise SystemExit('PDP runtime anchor not found')
          pdp=pdp.replace(anchor,runtime+anchor,1); pdp_path.write_text(pdp)
          hero_path=Path('sections/hero-video.liquid'); hero=hero_path.read_text()
          hero_anchor='''  {% if section.settings.show_scroll_cue %}\n    <button class="melato-hero-video__scroll" type="button" aria-label="Scroll to next section" data-melato-scroll-cue>'''
          if hero_anchor not in hero: raise SystemExit('hero anchor not found')
          hero=hero.replace(hero_anchor,'''  <button class="melato-hero-video__sound" type="button" data-melato-hero-sound aria-pressed="false" aria-label="Turn hero video sound on">Sound on</button>\n\n'''+hero_anchor,1)
          style_anchor='  .melato-hero-video__button--secondary:hover {'
          hero=hero.replace(style_anchor,"  .melato-hero-video__sound{position:absolute;right:clamp(16px,3vw,34px);bottom:clamp(18px,3vw,34px);z-index:5;min-height:42px;padding:0 16px;border:1px solid rgba(244,234,216,.36);border-radius:999px;background:rgba(5,5,5,.56);color:#f4ead8;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}\n  .melato-hero-video__sound:hover{background:rgba(244,234,216,.12)}\n\n"+style_anchor,1)
          sound_js='''<script>\n(function(){var section=document.getElementById('MelatoHeroVideo-{{ section.id }}');if(!section)return;var video=section.querySelector('.melato-hero-video__asset'),button=section.querySelector('[data-melato-hero-sound]');if(!video||!button){if(button)button.hidden=true;return}button.addEventListener('click',function(){if(video.muted){video.muted=false;video.removeAttribute('muted');video.volume=1;video.play().catch(function(){video.controls=true});button.textContent='Sound off';button.setAttribute('aria-pressed','true')}else{video.muted=true;video.setAttribute('muted','');button.textContent='Sound on';button.setAttribute('aria-pressed','false')}})})();\n</script>\n\n'''
          hero=hero.replace('{% schema %}',sound_js+'{% schema %}',1); hero_path.write_text(hero)
          hotfix_path=Path('snippets/melato-theme-audit-hotfix.liquid'); hotfix=hotfix_path.read_text()
          hotfix=re.sub(r"\n\s*if context == 'main' and template\.name == 'index'.*?\n\s*endif\n","\n",hotfix,count=1,flags=re.S)
          hotfix=re.sub(r"\n\s*assign related_products = product\.metafields\.custom\.related_products\.value.*?\n\s*endif\n\n\s*capture currency_runtime","\n\n    capture currency_runtime",hotfix,count=1,flags=re.S); hotfix_path.write_text(hotfix)
          sep10_path=Path('tests/sep10-pdp-audit-regressions.test.js'); sep10=sep10_path.read_text().replace('  assert.match(hotfix, /money_with_currency/);','  assert.match(filter, /money_with_currency/);').replace('  assert.match(hotfix, /You Might Also Like/);','  assert.doesNotMatch(hotfix, /melato-related-products--curated/);').replace('  assert.match(hotfix, /data-melato-hero-sound/);','  assert.doesNotMatch(hotfix, /data-melato-hero-sound/);'); sep10_path.write_text(sep10)
      - name: Run regression suite
        run: npm test
      - name: Commit verified migration
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "melato-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sections/melato-product-page-rebuild.liquid sections/hero-video.liquid snippets/melato-theme-audit-hotfix.liquid tests/sep10-pdp-audit-regressions.test.js
          git diff --cached --check
          git commit -m "Migrate PDP audit fixes into canonical components"
          git push origin HEAD:fix/sep27-pdp-audio-audit
