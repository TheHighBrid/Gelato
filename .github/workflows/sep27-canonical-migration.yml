name: Sep 27 canonical migration

on:
  push:
    branches: [fix/sep27-pdp-audio-audit]
    paths:
      - '.github/workflows/sep27-canonical-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sep27-pdp-audio-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate audit fixes into canonical owners
        shell: python
        run: |
          from pathlib import Path
          import re

          pdp_path = Path('sections/melato-product-page-rebuild.liquid')
          pdp = pdp_path.read_text()
          pdp = pdp.replace('current_variant.price | money }}', 'current_variant.price | money_with_currency }}')
          pdp = pdp.replace('current_variant.compare_at_price | money }}', 'current_variant.compare_at_price | money_with_currency }}')
          pdp = pdp.replace('product.price | money }}</p>', 'product.price | money_with_currency }}</p>')
          pdp = pdp.replace('matching_product.price | money }}</p>', 'matching_product.price | money_with_currency }}</p>')
          pdp = pdp.replace("Shopify.formatMoney(cents,{{ shop.money_format | json }})", "Shopify.formatMoney(cents,{{ shop.money_with_currency_format | json }})")

          old_set = '''              <p class="purchase-summary__price">{{ matching_product.price | money_with_currency }}</p>\n              <a class="pdp-set-cta" href="{{ matching_product.url }}">View matching piece</a>\n            </article>\n          </div>\n        </section>'''
          new_set = '''              <p class="purchase-summary__price">{{ matching_product.price | money_with_currency }}</p>\n              <a class="pdp-set-cta" href="{{ matching_product.url }}">View matching piece</a>\n            </article>\n          </div>\n          <div class="melato-full-set-action melato-full-set-action--canonical" data-melato-server-full-set data-currency="{{ shop.currency | escape }}">\n            <div class="melato-full-set-selectors">\n              <label class="melato-full-set-selector"><span>{% if product_title_down contains 'pant' %}Pant{% else %}Jacket{% endif %} size</span><select data-melato-set-current aria-label="Current product size">{% for variant in product.variants %}{% if variant.available %}<option value="{{ variant.id }}" data-price="{{ variant.price }}"{% if variant.id == current_variant.id %} selected{% endif %}>{{ variant.title }}</option>{% endif %}{% endfor %}</select></label>\n              <label class="melato-full-set-selector"><span>{% if product_title_down contains 'pant' %}Jacket{% else %}Pant{% endif %} size</span><select data-melato-set-matching aria-label="Matching product size">{% for variant in matching_product.variants %}{% if variant.available %}<option value="{{ variant.id }}" data-price="{{ variant.price }}"{% if variant.id == matching_product.selected_or_first_available_variant.id %} selected{% endif %}>{{ variant.title }}</option>{% endif %}{% endfor %}</select></label>\n            </div>\n            <p class="melato-full-set-price"><span>Full set</span><strong data-melato-set-total>{{ current_variant.price | plus: matching_product.selected_or_first_available_variant.price | money_with_currency }}</strong></p>\n            <button type="button" class="melato-full-set-button" data-melato-set-add>ADD FULL SET</button>\n            <p class="melato-full-set-status" data-melato-set-status role="status" aria-live="polite"></p>\n          </div>\n        </section>'''
          if old_set not in pdp:
              raise SystemExit('canonical Complete the Set anchor not found')
          pdp = pdp.replace(old_set, new_set, 1)

          script_anchor = "  var stickyButton=section.querySelector('[data-pdp-sticky-button]');"
          set_runtime = r'''  var fullSet=section.querySelector('[data-melato-server-full-set]');
          if(fullSet){
            var currentSelect=fullSet.querySelector('[data-melato-set-current]');
            var matchingSelect=fullSet.querySelector('[data-melato-set-matching]');
            var totalNode=fullSet.querySelector('[data-melato-set-total]');
            var addSet=fullSet.querySelector('[data-melato-set-add]');
            var statusNode=fullSet.querySelector('[data-melato-set-status]');
            function setTotal(){
              if(!currentSelect||!matchingSelect||!totalNode)return;
              var a=currentSelect.options[currentSelect.selectedIndex];
              var b=matchingSelect.options[matchingSelect.selectedIndex];
              totalNode.textContent=formatMoney(Number(a.dataset.price||0)+Number(b.dataset.price||0));
            }
            if(currentSelect)currentSelect.addEventListener('change',setTotal);
            if(matchingSelect)matchingSelect.addEventListener('change',setTotal);
            setTotal();
            if(addSet)addSet.addEventListener('click',function(){
              if(!currentSelect||!matchingSelect)return;
              addSet.disabled=true;if(statusNode)statusNode.textContent='Adding set…';
              fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({items:[{id:Number(currentSelect.value),quantity:1},{id:Number(matchingSelect.value),quantity:1}]})})
                .then(function(response){if(!response.ok)throw new Error('Unable to add full set');return response.json()})
                .then(function(){if(statusNode)statusNode.textContent='Full set added to cart';document.dispatchEvent(new CustomEvent('cart:refresh'));})
                .catch(function(){if(statusNode)statusNode.textContent='Could not add the full set. Please try again.';})
                .finally(function(){addSet.disabled=false;});
            });
          }

'''
          if script_anchor not in pdp:
              raise SystemExit('PDP runtime anchor not found')
          pdp = pdp.replace(script_anchor, set_runtime + script_anchor, 1)
          pdp_path.write_text(pdp)

          hero_path = Path('sections/hero-video.liquid')
          hero = hero_path.read_text()
          hero_anchor = '''  {% if section.settings.show_scroll_cue %}\n    <button class="melato-hero-video__scroll" type="button" aria-label="Scroll to next section" data-melato-scroll-cue>'''
          hero_button = '''  <button class="melato-hero-video__sound" type="button" data-melato-hero-sound aria-pressed="false" aria-label="Turn hero video sound on">Sound on</button>\n\n'''
          if hero_anchor not in hero:
              raise SystemExit('hero button anchor not found')
          hero = hero.replace(hero_anchor, hero_button + hero_anchor, 1)
          style_anchor = '''  .melato-hero-video__button--secondary:hover {'''
          sound_css = '''  .melato-hero-video__sound { position:absolute; right:clamp(16px,3vw,34px); bottom:clamp(18px,3vw,34px); z-index:5; min-height:42px; padding:0 16px; border:1px solid rgba(244,234,216,.36); border-radius:999px; background:rgba(5,5,5,.56); color:#f4ead8; font:700 11px/1 var(--font-body-family,Arial,sans-serif); letter-spacing:.16em; text-transform:uppercase; backdrop-filter:blur(12px); cursor:pointer; }\n  .melato-hero-video__sound:hover { background:rgba(244,234,216,.12); }\n\n'''
          if style_anchor not in hero:
              raise SystemExit('hero style anchor not found')
          hero = hero.replace(style_anchor, sound_css + style_anchor, 1)
          script_end_anchor = '''{% schema %}'''
          sound_js = '''<script>\n(function(){\n  var section=document.getElementById('MelatoHeroVideo-{{ section.id }}');\n  if(!section)return;\n  var video=section.querySelector('.melato-hero-video__asset');\n  var button=section.querySelector('[data-melato-hero-sound]');\n  if(!video||!button){if(button)button.hidden=true;return;}\n  button.addEventListener('click',function(){\n    if(video.muted){video.muted=false;video.removeAttribute('muted');video.volume=1;video.play().catch(function(){video.controls=true});button.textContent='Sound off';button.setAttribute('aria-pressed','true');button.setAttribute('aria-label','Turn hero video sound off');}\n    else{video.muted=true;video.setAttribute('muted','');button.textContent='Sound on';button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','Turn hero video sound on');}\n  });\n})();\n</script>\n\n'''
          if script_end_anchor not in hero:
              raise SystemExit('hero schema anchor not found')
          hero = hero.replace(script_end_anchor, sound_js + script_end_anchor, 1)
          hero_path.write_text(hero)

          hotfix_path = Path('snippets/melato-theme-audit-hotfix.liquid')
          hotfix = hotfix_path.read_text()
          hotfix = re.sub(r"\n\s*if context == 'main' and template\.name == 'index'.*?\n\s*endif\n", "\n", hotfix, count=1, flags=re.S)
          hotfix = re.sub(r"\n\s*assign related_products = product\.metafields\.custom\.related_products\.value.*?\n\s*endif\n\n\s*capture currency_runtime", "\n\n    capture currency_runtime", hotfix, count=1, flags=re.S)
          hotfix_path.write_text(hotfix)

          sep10_path = Path('tests/sep10-pdp-audit-regressions.test.js')
          sep10 = sep10_path.read_text()
          sep10 = sep10.replace("  assert.match(hotfix, /money_with_currency/);", "  assert.match(filter, /money_with_currency/);")
          sep10 = sep10.replace("  assert.match(hotfix, /You Might Also Like/);", "  assert.doesNotMatch(hotfix, /melato-related-products--curated/);")
          sep10 = sep10.replace("  assert.match(hotfix, /data-melato-hero-sound/);", "  assert.doesNotMatch(hotfix, /data-melato-hero-sound/);")
          sep10_path.write_text(sep10)
      - name: Run regression suite
        run: npm test
      - name: Commit verified migration
        run: |
          git config user.name "melato-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sections/melato-product-page-rebuild.liquid sections/hero-video.liquid snippets/melato-theme-audit-hotfix.liquid tests/sep10-pdp-audit-regressions.test.js
          git diff --cached --check
          git commit -m "Migrate PDP audit fixes into canonical components"
          git push origin HEAD:fix/sep27-pdp-audio-audit
