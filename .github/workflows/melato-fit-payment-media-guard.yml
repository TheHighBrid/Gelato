name: Melato fit payment media guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Protect fit, payment and media contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          failures = []

          def read(path):
              file = Path(path)
              if not file.exists():
                  failures.append(f'{path}: missing')
                  return ''
              return file.read_text()

          # Fit guidance intentionally renders the curated Shopify Page body and
          # must never generate a universal house measurement chart in the theme.
          fit_page = read('templates/page.size-guide.liquid')
          for banned in ('<table', 'All measurements', 'Chest (in)', 'Waist (in)', 'Hip (in)', 'Category measurements'):
              if banned in fit_page:
                  failures.append(f'templates/page.size-guide.liquid: generic sizing output returned: {banned!r}')
          for required in ('page.content', 'Fit is product-specific.', 'Product Measurements', 'support@melato.ca'):
              if required not in fit_page:
                  failures.append(f'templates/page.size-guide.liquid: required fit contract missing: {required!r}')

          modal = read('snippets/size-guide-modal.liquid')
          if 'Legacy global size-guide output intentionally disabled.' not in modal:
              failures.append('snippets/size-guide-modal.liquid: legacy global size modal was re-enabled')

          # Fit handoff belongs on the PDP where the buying decision happens.
          polish = read('assets/melato-pdp-polish.js')
          for required in ('ensureFitGuidance(root);', '/pages/size-guide', 'Fit guidance and measurement policy'):
              if required not in polish:
                  failures.append(f'assets/melato-pdp-polish.js: PDP fit-guidance contract missing: {required!r}')

          # Default and compatibility PDPs stay on the consolidated renderer and
          # do not surface accelerated-wallet brand UI inside the product template.
          pdp = read('sections/melato-product-page-rebuild.liquid')
          for banned in ('payment_button', 'content_for_additional_checkout_buttons'):
              if banned in pdp:
                  failures.append(f'sections/melato-product-page-rebuild.liquid: accelerated checkout surface returned: {banned!r}')

          compatibility = read('templates/product.melato-audit.json')
          if '"type": "main-product"' in compatibility:
              failures.append('templates/product.melato-audit.json: legacy main-product section returned')
          if '"type": "melato-product-page-rebuild"' not in compatibility:
              failures.append('templates/product.melato-audit.json: consolidated Melato PDP missing')
          for banned in ('Shop Pay', 'Apple Pay', 'Google Pay'):
              if banned in compatibility:
                  failures.append(f'templates/product.melato-audit.json: branded wallet proof returned: {banned!r}')

          # High-traffic image sections keep responsive CDN output and sane source ceilings.
          media_contracts = {
              'sections/melato-home-conversion.liquid': (1, 0),
              'sections/melato-product-page-rebuild.liquid': (3, 2),
              'sections/melato-footer.liquid': (1, 1),
          }
          for path, (min_widths, min_lazy) in media_contracts.items():
              source = read(path)
              if source.count('widths:') < min_widths:
                  failures.append(f'{path}: responsive image widths contract weakened')
              if source.count("loading: 'lazy'") < min_lazy:
                  failures.append(f'{path}: below-fold lazy loading contract weakened')
              for match in re.finditer(r'image_url:\s*width:\s*(\d+)', source):
                  width = int(match.group(1))
                  if width > 2400:
                      failures.append(f'{path}: image source ceiling {width}px exceeds 2400px')

          cards = read('snippets/product-card.liquid')
          if cards.count('srcset=') < 2:
              failures.append('snippets/product-card.liquid: responsive product-card srcset contract weakened')
          if cards.count('loading="lazy"') < 2:
              failures.append('snippets/product-card.liquid: product-card lazy loading contract weakened')

          if failures:
              print('Melato fit/payment/media regression detected:')
              for failure in failures:
                  print(f' - {failure}')
              raise SystemExit(1)

          print('Melato fit/payment/media guard passed.')
