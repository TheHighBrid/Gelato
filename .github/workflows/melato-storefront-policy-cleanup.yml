name: Melato storefront policy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/melato-storefront-policy-cleanup.yml'

permissions:
  contents: write

jobs:
  prepare-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize storefront policy state
        shell: bash
        run: |
          git checkout -b agent/storefront-policy-cleanup-20260807
          python - <<'PY'
          import json
          from pathlib import Path

          settings_path = Path('config/settings_data.json')
          raw = settings_path.read_text()
          data = json.loads(raw)
          current = data['current']

          current['cart_free_shipping_bar'] = False
          current['cart_free_shipping_threshold'] = '0'

          sections = current.get('sections', {})
          announcement = sections.get('melato-announcement-bar', {}).get('settings', {})
          fallback = announcement.get('fallback_message', '')
          fallback = fallback.replace(' · COMPLIMENTARY DELIVERY ON ALL ORDERS', '')
          fallback = fallback.replace('COMPLIMENTARY DELIVERY ON ALL ORDERS · ', '')
          fallback = fallback.replace('COMPLIMENTARY DELIVERY ON ALL ORDERS', '')
          while ' ·  · ' in fallback:
              fallback = fallback.replace(' ·  · ', ' · ')
          announcement['fallback_message'] = fallback.strip()

          footer = sections.get('melato-footer', {}).get('settings', {})
          footer['show_payment_icons'] = False

          settings_path.write_text(json.dumps(data, separators=(',', ':')))

          pdp_path = Path('sections/melato-product-page-rebuild.liquid')
          pdp = pdp_path.read_text()
          pdp = pdp.replace(
              'Orders usually prepare within 1 to 3 business days. Complimentary delivery is available on all orders.',
              'Orders usually prepare within 1 to 3 business days. Delivery timing is confirmed at checkout.'
          )
          pdp_path.write_text(pdp)

          ann_path = Path('sections/melato-announcement-bar.liquid')
          ann = ann_path.read_text()
          ann = ann.replace(
              '{"type":"text","id":"cta_text","label":"CTA button text","default":"Shop now"}',
              '{"type":"text","id":"cta_text","label":"CTA button text"}'
          )
          ann_path.write_text(ann)
          PY

          git config user.name 'melato-policy-cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add config/settings_data.json sections/melato-product-page-rebuild.liquid sections/melato-announcement-bar.liquid
          git commit -m 'Remove residual delivery and payment UI state'
          git push origin HEAD:agent/storefront-policy-cleanup-20260807
