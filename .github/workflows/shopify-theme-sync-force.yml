name: Shopify hero sync bridge

on:
  push:
    branches:
      - agent/force-shopify-hero-sync
    paths:
      - '.shopify-sync/force-hero-sync.txt'

permissions:
  contents: write

jobs:
  fix-and-touch-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Shopify-valid hero source for user merge
        shell: bash
        run: |
          if [ ! -f .shopify-sync/force-hero-sync.txt ]; then
            echo 'Trigger already consumed.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('sections/melato-hero.liquid')
          text = path.read_text()
          invalid = '          "label": "Primary button label",\n          "default": ""\n'
          valid = '          "label": "Primary button label"\n'
          if invalid in text:
              text = text.replace(invalid, valid, 1)
          marker = '{% comment %} Melato hero policy sync marker 2026-08-07b {% endcomment %}'
          if marker not in text:
              text = text.rstrip() + '\n' + marker + '\n'
          path.write_text(text)
          PY
          rm .shopify-sync/force-hero-sync.txt
          git config user.name 'melato-sync-bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add sections/melato-hero.liquid .shopify-sync/force-hero-sync.txt
          git commit -m 'Prepare Shopify-valid hero policy sync'
          git push origin HEAD:agent/force-shopify-hero-sync
