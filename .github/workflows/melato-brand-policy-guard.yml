name: Melato brand policy guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protect-brand-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require explicit owner authorization for announcement color system edits
        if: github.event_name == 'pull_request'
        shell: python
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          import os
          import subprocess

          protected = {
              'sections/melato-announcement-bar.liquid',
              'snippets/melato-product-color-engine.liquid',
              'assets/melato-ann-color.js',
              'assets/melato-dynamic-bar.js',
              '.github/workflows/melato-brand-policy-guard.yml',
              '.github/CODEOWNERS',
          }

          parents = subprocess.check_output(
              ['git', 'rev-list', '--parents', '-n', '1', 'HEAD'],
              text=True,
          ).split()
          if len(parents) < 3:
              print('Expected GitHub pull-request merge checkout with two parents.')
              raise SystemExit(1)

          base_parent = parents[1]
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', base_parent, 'HEAD'],
                  text=True,
              ).splitlines()
          )

          color_changes = sorted(changed & protected)
          authorization = 'OWNER AUTHORIZATION: ANNOUNCEMENT COLOR SYSTEM CHANGE APPROVED'
          body = os.environ.get('PR_BODY') or ''

          if color_changes and authorization not in body:
              print('Owner-protected announcement color files changed without explicit authorization:')
              for filename in color_changes:
                  print(f' - {filename}')
              print(f'Required PR body marker: {authorization}')
              raise SystemExit(1)

          print('Announcement color ownership authorization check passed.')

      - name: Block removed commerce UI from returning
        shell: python
        run: |
          from pathlib import Path

          checks = {
              'sections/melato-product-page-rebuild.liquid': {
                  'banned': [
                      'content_for_additional_checkout_buttons',
                      '<li>Fast dispatch</li>',
                      '<li>Secure checkout</li>',
                      'class="product-assurances"',
                      'Complimentary delivery is available on all orders.',
                  ],
                  'required': [
                      'product.metafields.melato.product_story',
                      'product.metafields.melato.material_composition',
                      'product.metafields.melato.fit',
                      'product.metafields.melato.care_instructions',
                      'product.metafields.melato.colorway',
                  ],
              },
              'sections/melato-home-conversion.liquid': {
                  'banned': [
                      '<strong>Fast dispatch</strong>',
                      '<strong>Secure checkout</strong>',
                      'Shop Pay',
                      'Apple Pay',
                      'Google Pay',
                      'melato-home-conversion__ctas',
                      'primary_cta_label',
                      'secondary_cta_label',
                  ],
                  'required': [],
              },
              'sections/melato-header.liquid': {
                  'banned': [
                      '>Shop all</a>',
                      '<span>02</span>Shop</a>',
                  ],
                  'required': [],
              },
              'sections/melato-hero.liquid': {
                  'banned': [
                      '>Shop Now</a>',
                      '"default": "Shop Now"',
                      '"cta_label": "Shop Now"',
                  ],
                  'required': [],
              },
              'sections/melato-announcement-bar.liquid': {
                  'banned': [
                      '"default":"Shop now"',
                  ],
                  'required': [
                      'MELATO OWNER-PROTECTED ANNOUNCEMENT COLOR CONTRACT',
                      'product.metafields.custom.background_hex_color_code',
                      'product.metafields.custom.foreground_hex_color_code',
                      'product.metafields.custom.bar_bg',
                      'product.metafields.custom.bar_fg',
                      'product.metafields.custom.palette_1',
                      'product.metafields.custom.palette_2',
                      'product.metafields.custom.palette_3',
                      'data-melato-color-owner="announcement-section"',
                      'window.setInterval(rotate,4200)',
                      'background:var(--ab-bg)!important',
                      'assign fallback_message = section.settings.fallback_message',
                      'Melato storefront policy hard-stop',
                      '.shopify-payment-button',
                      '.melato-home-conversion__ctas',
                  ],
              },
              'snippets/cart-drawer.liquid': {
                  'banned': [
                      'Free shipping unlocked!',
                      'away from free shipping',
                      'Complimentary standard delivery.',
                      'cart_free_shipping_threshold',
                  ],
                  'required': [
                      'Taxes and applicable duties are calculated at checkout.',
                      'v2.7 — Melato cart policy cleanup',
                  ],
              },
              'sections/melato-footer.liquid': {
                  'banned': [
                      'shop.enabled_payment_types',
                      'payment_type_svg_tag',
                  ],
                  'required': [],
              },
              'templates/index.json': {
                  'banned': [
                      '"text": "Complimentary delivery on all orders."',
                  ],
                  'required': [],
              },
              'config/settings_data.json': {
                  'banned': [
                      '"cart_free_shipping_bar":true',
                      '"show_payment_icons":true',
                      'COMPLIMENTARY DELIVERY ON ALL ORDERS',
                  ],
                  'required': [],
              },
          }

          failures = []
          for filename, policy in checks.items():
              path = Path(filename)
              if not path.exists():
                  failures.append(f'{filename}: required policy file is missing')
                  continue
              text = path.read_text()
              for needle in policy['banned']:
                  if needle in text:
                      failures.append(f'{filename}: removed UI returned: {needle!r}')
              for needle in policy['required']:
                  if needle not in text:
                      failures.append(f'{filename}: required Melato policy contract missing: {needle!r}')

          if failures:
              print('Melato brand policy regression detected:')
              for failure in failures:
                  print(f' - {failure}')
              raise SystemExit(1)

          print('Melato brand policy guard passed.')
