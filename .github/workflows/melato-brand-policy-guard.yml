name: Melato brand policy guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protect-brand-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require explicit owner authorization for announcement color system edits
        if: github.event_name == 'pull_request'
        shell: python
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          import os
          import subprocess

          protected = {
              'sections/melato-announcement-bar.liquid',
              'snippets/melato-product-color-engine.liquid',
              'assets/melato-ann-color.js',
              'assets/melato-dynamic-bar.js',
              '.github/workflows/melato-brand-policy-guard.yml',
              '.github/CODEOWNERS',
          }

          parents = subprocess.check_output(
              ['git', 'rev-list', '--parents', '-n', '1', 'HEAD'],
              text=True,
          ).split()
          if len(parents) < 3:
              print('Expected GitHub pull-request merge checkout with two parents.')
              raise SystemExit(1)

          base_parent = parents[1]
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', base_parent, 'HEAD'],
                  text=True,
              ).splitlines()
          )

          color_changes = sorted(changed & protected)
          authorization = 'OWNER AUTHORIZATION: ANNOUNCEMENT COLOR SYSTEM CHANGE APPROVED'
          body = os.environ.get('PR_BODY') or ''

          if color_changes and authorization not in body:
              print('Owner-protected announcement color files changed without explicit authorization:')
              for filename in color_changes:
                  print(f' - {filename}')
              print(f'Required PR body marker: {authorization}')
              raise SystemExit(1)

          print('Announcement color ownership authorization check passed.')

      - name: Protect repaired storefront contracts
        shell: python
        run: |
          from pathlib import Path

          failures = []

          def read(path):
              file = Path(path)
              if not file.exists():
                  failures.append(f'{path}: required file is missing')
                  return ''
              return file.read_text()

          def require(path, needle, label=None):
              if needle not in read(path):
                  failures.append(f'{path}: missing {label or needle!r}')

          def ban(path, needle, label=None):
              file = Path(path)
              if file.exists() and needle in file.read_text():
                  failures.append(f'{path}: forbidden {label or needle!r} returned')

          # Announcement owns color and navigation only. It must never suppress unrelated commerce UI.
          for needle in (
              'MELATO OWNER-PROTECTED ANNOUNCEMENT COLOR CONTRACT',
              'product.metafields.custom.background_hex_color_code',
              'product.metafields.custom.foreground_hex_color_code',
              'product.metafields.custom.palette_1',
              'product.metafields.custom.palette_2',
              'product.metafields.custom.palette_3',
              'data-melato-color-owner="announcement-section"',
              'window.setInterval(rotate,4200)',
              'href="/pages/popup-calendar"',
          ):
              require('sections/melato-announcement-bar.liquid', needle)
          for needle in (
              'Melato storefront policy hard-stop',
              '.shopify-payment-button',
              '.pdp-proof-mini',
              '.melato-home-conversion__ctas',
              'new MutationObserver',
          ):
              ban('sections/melato-announcement-bar.liquid', needle, 'cross-component suppression')

          # Footer trust surfaces are intentional and must remain source-rendered.
          for needle in (
              'support@melato.ca',
              '+1 (613) 209-6464',
              "form 'customer'",
              'shop.enabled_payment_types',
              'payment_type_svg_tag',
              'Complimentary standard delivery',
              'Secure checkout',
              '/pages/popup-calendar',
              '/blogs/news',
          ):
              require('sections/melato-footer.liquid', needle)
          ban('sections/melato-footer.liquid', 'new MutationObserver', 'footer mutation observer')

          # Cart values must be formatted from the current presentment currency.
          for needle in ('Intl.NumberFormat', 'cart.currency', 'style:\'currency\''):
              require('assets/melato-cart-drawer.js', needle)
          ban('assets/melato-cart-drawer.js', '"$"+(Number(cents||0)/100)', 'hard-coded dollar fallback')

          # PDP polish may enhance interaction, but P0 stability mode intentionally
          # disables that enhancement layer. In safe mode the server-rendered PDP owns
          # the shopper-facing trust and fit surfaces, and the polish file must remain inert.
          polish = read('assets/melato-pdp-polish.js')
          safe_mode = 'P0 commerce-safe PDP mode' in polish and "melatoPdpPolishRuntime = 'disabled-p0'" in polish
          if safe_mode:
              for needle in ('P0 commerce-safe PDP mode', "melatoPdpPolishRuntime = 'disabled-p0'"):
                  require('assets/melato-pdp-polish.js', needle)
              for needle in ('MutationObserver', 'ensureProductGallery(root);', 'bindMainImageZoom(root);'):
                  ban('assets/melato-pdp-polish.js', needle, 'active P0 polish behavior')
              for needle in ('class="pdp-proof-mini"', '<summary>Shipping &amp; returns</summary>', 'data-open-size-drawer'):
                  require('sections/melato-product-page-rebuild.liquid', needle, 'server-rendered P0 PDP contract')
              require('templates/page.size-guide.liquid', 'Fit is product-specific.', 'fit guidance policy')
          else:
              for needle in ('Complimentary delivery', 'Secure checkout', 'Eligible returns', '/pages/size-guide'):
                  require('assets/melato-pdp-polish.js', needle)
          for needle in (
              'Exact fibre percentage is not published yet',
              'to be confirmed|tbd|not provided|information unavailable|details unavailable',
              'dynamicCompleteSet',
          ):
              ban('assets/melato-pdp-polish.js', needle, 'client-side catalog data scrubber')

          # Reviews are intentionally removed from the default PDP.
          for needle in ('judge_me_reviews', 'shopify://apps/judge-me', 'jdgm-widget'):
              ban('templates/product.json', needle, 'Judge.me product embed')
              ban('sections/product-tabs.liquid', needle, 'Judge.me product markup')

          # Audit-era global loaders must not be reintroduced through structured-data snippets.
          for needle in (
              'melato-audit-guard.js',
              'melato-audit-completion-2026.js',
              'melato-audit-completion-2026.css',
              'melato-audit-nav-collections.js',
          ):
              ban('snippets/melato-global-jsonld.liquid', needle, 'audit asset loader')
          ban('layout/theme.liquid', 'melato-hero-video.js', 'dead homepage video loader')

          # Content infrastructure required by the current storefront.
          require('templates/page.popup-calendar.json', '"type": "melato-popup-calendar"', 'popup calendar template')
          require('sections/melato-popup-calendar.liquid', 'AUGUST 20, 2026', 'Popup Show #5 date')
          require('templates/404.json', '"main"', 'enabled 404 section')
          ban('templates/404.json', '"disabled": true', 'disabled 404 content')

          if failures:
              print('Melato brand policy regression detected:')
              for failure in failures:
                  print(' -', failure)
              raise SystemExit(1)

          print('Melato repaired brand policy guard passed.')
