name: Melato cart behavioral regression
on:
  pull_request:
    paths:
      - 'assets/melato-cart-drawer.js'
      - 'snippets/cart-drawer.liquid'
      - 'tests/cart-*.test.js'
      - '.github/workflows/cart-behavior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cart-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute real cart script behavioral tests
        run: node --test tests/cart-*.test.js
