name: Melato storefront integrity guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  storefront-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check storefront JavaScript syntax
        run: |
          find assets -maxdepth 1 -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check

      - name: Validate Melato storefront contracts
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          failures = []

          def text(path):
              file = Path(path)
              if not file.exists():
                  failures.append(f'{path}: required file is missing')
                  return ''
              return file.read_text()

          def require(path, needle, label=None):
              if needle not in text(path):
                  failures.append(f'{path}: missing {label or needle!r}')

          def ban(path, needle, label=None):
              file = Path(path)
              if file.exists() and needle in file.read_text():
                  failures.append(f'{path}: forbidden {label or needle!r} returned')

          # Every literal theme asset reference must resolve to a checked-in file.
          # Scan every Liquid surface, including templates and blocks, so missing assets cannot hide outside sections/snippets.
          for liquid_file in sorted(Path('.').rglob('*.liquid')):
              if '.git' in liquid_file.parts:
                  continue
              source = liquid_file.read_text()
              for match in re.finditer(r"['\"]([^'\"]+)['\"]\s*\|\s*asset_url", source):
                  asset = Path('assets', match.group(1))
                  if not asset.is_file():
                      failures.append(f'{liquid_file}: referenced asset is missing: {asset}')

          # Retired duplicate concierge implementations stay retired.
          for filename in (
              'sections/melato-concierge-strip.liquid',
              'sections/melato-fit-concierge.liquid',
              'sections/melato-delivery-concierge.liquid',
              'sections/melato-order-companion.liquid',
              'sections/melato-preview-gate.liquid',
              'templates/page.melato-fit-concierge.json',
              'templates/page.melato-delivery-concierge.json',
              'templates/page.melato-order-companion.json',
              'templates/page.melato-preview-room.json',
              'snippets/melato-utility-layer.liquid',
          ):
              if Path(filename).exists():
                  failures.append(f'{filename}: retired implementation returned')

          # PDP layout and source-rendered product architecture remain canonical.
          for needle, label in (
              ('body.template-product .melato-pdp-rebuild', 'PDP canvas contract'),
              ('"gallery buybox"', 'desktop gallery/buybox layout'),
              ('"gallery story"', 'desktop story placement'),
              ('"gallery specs"', 'desktop spec placement'),
              ('grid-area: gallery !important;', 'gallery placement'),
              ('grid-area: specs !important;', 'spec placement'),
          ):
              require('assets/melato-pdp-layout-2026.css', needle, label)

          pdp = text('sections/melato-product-page-rebuild.liquid')
          for needle, label in (
              ('class="pdp-gallery"', 'primary product gallery'),
              ("class: 'pdp-main-image'", 'primary product image'),
              ('data-pdp-thumb', 'source-rendered gallery controls'),
              ("mainImage.src=button.getAttribute('data-media-src')", 'source-rendered gallery switching'),
              ('class="pdp-panel pdp-story"', 'Story section'),
              ('<summary>Construction</summary>', 'Construction capsule'),
              ('<summary><span>Fit</span>', 'Fit capsule'),
              ('<summary><span>Materials</span>', 'Material capsule'),
              ('<summary><span>Care</span>', 'Care capsule'),
              ('Ships in 1 to 3 business days. Complimentary delivery on all orders. Returns accepted on eligible unworn items under the posted return policy.', 'canonical Shipping & Returns microcopy'),
              ('product.metafields.custom.size_guide.value', 'product-specific size guide source'),
              ('data-open-size-drawer', 'product-specific size guide trigger'),
              ("render 'size-guide-drawer', product: product", 'product-specific size guide drawer'),
              ('product.metafields.custom.matching_product.value', 'matching product source'),
              ('product.metafields.custom.set_partner.value', 'set partner fallback'),
              ('class="pdp-panel pdp-set"', 'Complete the Set module'),
          ):
              if needle not in pdp:
                  failures.append(f'sections/melato-product-page-rebuild.liquid: missing {label}')

          # Product Page Bible v1 keeps Shipping & Returns as one microcopy source and
          # keeps accelerated checkout and legacy duplicate reassurance surfaces retired.
          for forbidden, label in (
              ('<summary>Shipping &amp; returns</summary>', 'duplicate Shipping & Returns disclosure'),
              ('<summary>Shipping & returns</summary>', 'duplicate Shipping & Returns disclosure'),
              ('class="pdp-proof-mini"', 'retired purchase reassurance block'),
              ('payment_button', 'accelerated checkout surface'),
              ('content_for_additional_checkout_buttons', 'accelerated checkout surface'),
          ):
              if forbidden in pdp:
                  failures.append(f'sections/melato-product-page-rebuild.liquid: forbidden {label} returned')

          # P0 stability contract: the retired polish layer stays disabled. Gallery,
          # fit and canonical shipping behavior are validated above in the canonical
          # section instead of reintroducing the observer-driven duplicate runtime.
          polish = text('assets/melato-pdp-polish.js')
          if "melatoPdpPolishRuntime = 'disabled-p0'" not in polish:
              failures.append('assets/melato-pdp-polish.js: P0 disabled runtime marker missing')
          for forbidden, label in (
              ('ensureProductGallery(', 'duplicate gallery runtime'),
              ('bindMainImageZoom(', 'retired hero zoom runtime'),
              ('ensurePurchaseReassurance(', 'client-side reassurance injection'),
              ('ensureFitGuidance(', 'client-side fit injection'),
              ('new MutationObserver', 'PDP mutation observer'),
          ):
              if forbidden in polish:
                  failures.append(f'assets/melato-pdp-polish.js: forbidden {label} returned')

          # PDP disclosure state belongs to the shopper. Product runtime code must not
          # force-close Construction, Fit, Material, Care, or Shipping disclosures.
          disclosure_close_patterns = (
              re.compile(r"template-product.{0,240}details.{0,240}removeAttribute\(\s*['\"]open['\"]\s*\)", re.I | re.S),
              re.compile(r"pdp-(?:spec|mini-detail).{0,240}removeAttribute\(\s*['\"]open['\"]\s*\)", re.I | re.S),
              re.compile(r"pdp-(?:spec|mini-detail).{0,240}\.open\s*=\s*false", re.I | re.S),
              re.compile(r"pdp-(?:spec|mini-detail).{0,240}toggleAttribute\(\s*['\"]open['\"]\s*,\s*false\s*\)", re.I | re.S),
          )
          for js_file in sorted(Path('assets').glob('*.js')):
              source = js_file.read_text()
              for pattern in disclosure_close_patterns:
                  if pattern.search(source):
                      failures.append(f'{js_file}: forbidden PDP force-close behavior detected')

          cleanup = text('assets/melato-site-cleanup-20260811.js')
          if 'PDP disclosure state is user-owned' not in cleanup:
              failures.append('assets/melato-site-cleanup-20260811.js: PDP disclosure ownership contract is missing')
          if "if(document.body.matches('.template-product'))return;" not in cleanup:
              failures.append('assets/melato-site-cleanup-20260811.js: product pages must be excluded from the document-wide cleanup observer')

          # Default product template has exactly one Melato renderer and no review app embeds.
          product_template = text('templates/product.json')
          if product_template.count('melato-product-page-rebuild') != 1:
              failures.append('templates/product.json: default PDP must contain exactly one primary renderer')
          for forbidden in ('melato-complete-the-set', 'complete-the-set', 'judge_me_reviews', 'shopify://apps/judge-me'):
              if forbidden in product_template:
                  failures.append(f'templates/product.json: forbidden duplicate/app renderer returned: {forbidden}')

          # Announcement and footer may not mutate unrelated surfaces.
          announcement = text('sections/melato-announcement-bar.liquid')
          for forbidden in ('new MutationObserver', '.pdp-proof-mini', '.shopify-payment-button', '.melato-home-conversion__ctas'):
              if forbidden in announcement:
                  failures.append(f'sections/melato-announcement-bar.liquid: cross-component behavior returned: {forbidden}')
          footer = text('sections/melato-footer.liquid')
          if 'new MutationObserver' in footer:
              failures.append('sections/melato-footer.liquid: runtime UI deletion returned')
          for required in ('support@melato.ca', "form 'customer'", 'shop.enabled_payment_types', 'payment_type_svg_tag'):
              if required not in footer:
                  failures.append(f'sections/melato-footer.liquid: trust surface missing: {required}')

          # Homepage must have a visual hero with a source fallback and a working signup path.
          for required in ('hero_image', 'home_collection.image', "class: 'melato-home-clean__hero-image'", "fetchpriority: 'high'"):
              require('sections/melato-home-conversion.liquid', required, 'homepage visual hero contract')
          require('sections/drop-signup.liquid', "assign form_id = 'droplist-form-' | append: section.id", 'rendered newsletter form ID')
          ban('sections/drop-signup.liquid', 'action="/contact#droplist-form-{{ section.id }}"', 'literal unrendered Liquid form action')

          # Predictive search remains progressive enhancement over normal GET search.
          for required in ('search/suggest.json', 'resources[type]=product', 'method="get"', 'Search Melato'):
              require('snippets/search-drawer.liquid', required, 'predictive search contract')

          # SEO/global loader consolidation.
          layout = text('layout/theme.liquid')
          if layout.count('melato-audit-nav-collections.js') != 1:
              failures.append('layout/theme.liquid: nav audit script must load exactly once')
          ban('layout/theme.liquid', 'melato-hero-video.js', 'unused hero video loader')
          jsonld = text('snippets/melato-global-jsonld.liquid')
          for forbidden in ('melato-audit-guard.js', 'melato-audit-completion-2026.js', 'melato-audit-completion-2026.css', 'melato-audit-nav-collections.js'):
              if forbidden in jsonld:
                  failures.append(f'snippets/melato-global-jsonld.liquid: duplicate audit loader returned: {forbidden}')

          # Content routes added by the audit repair remain represented in the theme.
          require('templates/page.popup-calendar.json', '"type": "melato-popup-calendar"', 'popup calendar section mapping')
          require('sections/melato-popup-calendar.liquid', 'RELEASED 48H PRIOR', 'popup location mechanic')
          require('templates/404.json', '"type": "main-404"', '404 primary content')
          ban('templates/404.json', '"disabled": true', 'disabled 404 primary content')

          # Parse every data file. Shopify-generated JSON may have leading comments.
          json_files = sorted(
              path
              for folder in ('config', 'locales', 'templates')
              for path in Path(folder).glob('*.json')
          )
          for filename in json_files:
              raw = text(filename)
              while True:
                  cleaned = re.sub(r'^\s*/\*.*?\*/\s*', '', raw, count=1, flags=re.S)
                  if cleaned == raw:
                      break
                  raw = cleaned
              try:
                  json.loads(raw)
              except Exception as exc:
                  failures.append(f'{filename}: invalid JSON after Shopify comment removal: {exc}')

          if failures:
              print('Melato storefront integrity failures:')
              for failure in failures:
                  print(' -', failure)
              raise SystemExit(1)

          print('Melato storefront integrity guard passed.')
