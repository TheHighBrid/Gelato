name: Melato brand policy fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/melato-brand-policy-fix.yml'

permissions:
  contents: write

jobs:
  patch-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove regressions and align PDP data contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match in {path}, found {count}')
              p.write_text(text.replace(old, new, 1))
              print(f'patched {label}: {path}')

          pdp = 'sections/melato-product-page-rebuild.liquid'

          replace_exact(
              pdp,
              "  assign story_copy = product.metafields.custom.story.value | default: product.metafields.custom.product_story.value | default: product.metafields.custom.pdp_story.value | default: product.metafields.custom.pdp_story_content.value\n",
              "  assign story_copy = product.metafields.melato.product_story.value | default: product.metafields.custom.story.value | default: product.metafields.custom.product_story.value | default: product.metafields.custom.pdp_story.value | default: product.metafields.custom.pdp_story_content.value\n",
              'canonical story metafield'
          )
          replace_exact(
              pdp,
              "  assign fit_copy = product.metafields.custom.fit_summary.value | default: product.metafields.custom.fit.value\n",
              "  assign fit_copy = product.metafields.melato.fit.value | default: product.metafields.custom.fit_summary.value | default: product.metafields.custom.fit.value | default: product.metafields.custom.fit_notes.value\n",
              'canonical fit metafield'
          )
          replace_exact(
              pdp,
              "  assign material_copy = product.metafields.custom.fabric_composition.value | default: product.metafields.custom.composition.value | default: product.metafields.custom.material.value\n",
              "  assign material_copy = product.metafields.melato.material_composition.value | default: product.metafields.custom.material_care.value | default: product.metafields.custom.fabric_composition.value | default: product.metafields.custom.composition.value | default: product.metafields.custom.material.value | default: product.metafields.custom.material_profile.value\n",
              'canonical material metafield'
          )
          replace_exact(
              pdp,
              "  assign care_copy = product.metafields.custom.care_short.value | default: product.metafields.custom.care.value\n",
              "  assign care_copy = product.metafields.melato.care_instructions.value | default: product.metafields.custom.care_instructions.value | default: product.metafields.custom.care_short.value | default: product.metafields.custom.care.value | default: product.metafields.custom.care_notes.value\n",
              'canonical care metafield'
          )
          replace_exact(
              pdp,
              "  assign colorway_display = blank\n",
              "  assign colorway_display = product.metafields.melato.colorway.value | default: product.metafields.custom.colorway.value\n",
              'canonical colorway metafield'
          )
          replace_exact(
              pdp,
              "        <ul class=\"product-assurances\" role=\"list\" aria-label=\"Purchase assurances\">\n          <li>Fast dispatch</li>\n          <li>Complimentary delivery on all orders</li>\n          <li>Secure checkout</li>\n        </ul>\n\n",
              "",
              'remove redundant assurance strip'
          )
          replace_exact(
              pdp,
              "          {%- if additional_checkout_buttons and current_variant.available -%}<div class=\"pdp-dynamic-checkout\">{{ content_for_additional_checkout_buttons }}</div>{%- endif -%}\n",
              "",
              'remove accelerated checkout renderer'
          )

          index = 'templates/index.json'
          replace_exact(
              index,
              "        \"item_BXgTdL\": {\n          \"type\": \"item\",\n          \"settings\": {\n            \"text\": \"Complimentary delivery on all orders.\"\n          }\n        },\n",
              "",
              'remove homepage delivery ticker item'
          )
          replace_exact(
              index,
              "        \"item_BXgTdL\",\n",
              "",
              'remove homepage delivery ticker order entry'
          )

          header = 'sections/melato-header.liquid'
          replace_exact(
              header,
              "          <a href=\"{{ routes.all_products_collection_url }}\">Shop all</a>\n",
              "          <a href=\"{{ routes.all_products_collection_url }}\">Collection</a>\n",
              'remove generic Shop all label'
          )
          replace_exact(
              header,
              "            <a class=\"mxh__nav-link\" href=\"{{ routes.all_products_collection_url }}\"><span>02</span>Shop</a>\n",
              "            <a class=\"mxh__nav-link\" href=\"{{ routes.all_products_collection_url }}\"><span>02</span>Collection</a>\n",
              'remove generic Shop fallback label'
          )

          hero = 'sections/melato-hero.liquid'
          replace_exact(
              hero,
              "          <div class=\"m-hero__ctas\">\n            <a href=\"{{ routes.collections_url }}/all\" class=\"m-btn m-btn--primary\">Shop Now</a>\n          </div>\n",
              "",
              'remove fallback Shop Now button'
          )
          replace_exact(
              hero,
              "          \"default\": \"Shop Now\"\n",
              "          \"default\": \"\"\n",
              'remove Shop Now schema default'
          )
          replace_exact(
              hero,
              "            \"cta_label\": \"Shop Now\",\n            \"cta_url\": \"/collections/all\",\n",
              "",
              'remove Shop Now preset fallback'
          )

          banned = {
              pdp: [
                  'content_for_additional_checkout_buttons',
                  '<li>Fast dispatch</li>',
                  '<li>Secure checkout</li>',
                  '<li>Complimentary delivery on all orders</li>'
              ],
              index: ['\"text\": \"Complimentary delivery on all orders.\"'],
              hero: ['>Shop Now</a>', '\"default\": \"Shop Now\"']
          }
          for path, needles in banned.items():
              text = Path(path).read_text()
              leftovers = [needle for needle in needles if needle in text]
              if leftovers:
                  raise SystemExit(f'brand policy validation failed in {path}: {leftovers}')

          print('Melato brand policy validation passed.')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'melato-policy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sections/melato-product-page-rebuild.liquid sections/melato-header.liquid sections/melato-hero.liquid templates/index.json
          git commit -m 'Remove checkout regressions and align PDP metafields'
          git push origin HEAD:main
