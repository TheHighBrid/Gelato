name: Melato audit semantic repair

on:
  push:
    paths:
      - '.github/workflows/melato-audit-semantic-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified storefront repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'sections/main-collection.liquid',
              "assign collection_intro = 'The complete catalogue.'",
              "assign collection_intro = 'The complete Melato catalogue across the current rotation, limited releases and archive.'",
          )

          replace_once(
              'sections/melato-announcement-bar.liquid',
              '<span>{{ section.settings.fallback_message }}</span>{%- if section.settings.fallback_micro != blank -%}<small>{{ section.settings.fallback_micro }}</small>{%- endif -%}',
              '<span>{{ section.settings.fallback_message }}</span>{% if section.settings.fallback_micro != blank %} <small aria-hidden="true">{{ section.settings.fallback_micro }}</small>{% endif %}',
          )

          replace_once(
              'layout/theme.liquid',
              '.melato-trust-strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 24px;padding:12px 18px;background:#0a0a0a;color:#f5f1e8;border-top:1px solid rgba(245,241,232,.09);border-bottom:1px solid rgba(245,241,232,.09);font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;text-align:center}.melato-trust-strip a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(245,241,232,.38)}',
              '.melato-trust-strip{padding:12px 18px;background:#0a0a0a;color:#f5f1e8;border-top:1px solid rgba(245,241,232,.09);border-bottom:1px solid rgba(245,241,232,.09);font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;text-align:center}.melato-trust-strip ul{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 24px;margin:0;padding:0;list-style:none}.melato-trust-strip a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(245,241,232,.38)}',
          )

          replace_once(
              'layout/theme.liquid',
              '<section class="melato-trust-strip" aria-label="Shopping assurances"><span>Complimentary standard delivery</span><span>Prepared in 1–3 business days</span><a href="/policies/refund-policy">Free returns within 30 days</a><span>Secure checkout</span></section>',
              '<section class="melato-trust-strip" aria-label="Shopping assurances"><ul role="list"><li>Complimentary standard delivery</li><li>Prepared in 1–3 business days</li><li><a href="/policies/refund-policy">Free returns on eligible items within 30 days</a></li><li>Secure checkout</li></ul></section>',
          )
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'melato-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add layout/theme.liquid sections/main-collection.liquid sections/melato-announcement-bar.liquid
          git commit -m 'fix: close September 17 storefront audit defects'
          git push origin HEAD:main

